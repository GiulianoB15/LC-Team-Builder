name: Bajar datos de la fuente

# Solo manual, igual que el de retratos: son ~300 pedidos a un servidor ajeno y
# los datos cambian solo cuando sale contenido nuevo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bajar pasivas y números de skill
        run: node scripts/fetch-datos.mjs

      - name: Commitear lo que haya cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pasivas.json src/data/skills.json
          if git diff --staged --quiet; then
            echo "Sin cambios: los datos ya estaban al día."
            exit 0
          fi
          git commit -m "Actualizar pasivas y números de skill

          Generado por scripts/fetch-datos.mjs desde el workflow."
          git push
