name: Bajar recetas de la comunidad

# Aparte del de datos a propósito: esto no pide datos del juego sino equipos
# publicados por personas, contra el servidor de un proyecto chico. Que se corra
# cuando se quiera actualizar el índice, no como efecto secundario de otra cosa.
on:
  workflow_dispatch:
    inputs:
      probar:
        description: "Solo verificar que se llega y qué campos vuelven, sin escribir"
        type: boolean
        default: false
      limite:
        description: "Cuántas recetas bajar como máximo"
        default: "200"

permissions:
  contents: write

jobs:
  recetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bajar recetas
        env:
          LIMBUS_RECETAS_LIMITE: ${{ inputs.limite }}
        run: node scripts/fetch-recetas.mjs ${{ inputs.probar && '--probar' || '' }}

      - name: Commitear lo que haya cambiado
        if: '!inputs.probar'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/recetas.json
          if git diff --staged --quiet; then
            echo "Sin cambios: las recetas ya estaban al día."
            exit 0
          fi
          git commit -m "Actualizar recetas de la comunidad

          Generado por scripts/fetch-recetas.mjs desde el workflow."
          git push
