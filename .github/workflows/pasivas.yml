name: Bajar pasivas

# Solo manual, igual que el de retratos: son ~300 pedidos a un servidor ajeno y
# las pasivas cambian solo cuando sale contenido nuevo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pasivas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bajar pasivas de Identities y E.G.O
        run: node scripts/fetch-pasivas.mjs

      - name: Commitear lo que haya cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pasivas.json
          if git diff --staged --quiet; then
            echo "Sin cambios: las pasivas ya estaban al día."
            exit 0
          fi
          git commit -m "Actualizar pasivas de Identities y E.G.O

          Generado por scripts/fetch-pasivas.mjs desde el workflow."
          git push
